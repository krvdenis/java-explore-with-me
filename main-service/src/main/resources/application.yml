spring:
  datasource:
    url: jdbc:postgresql://ewm-db:5432/ewm
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format-sql: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
    show-sql: true
  sql:
    init:
      mode: always
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    serialization:
      write-dates-as-timestamps: false
    time-zone: "UTC"
  mvc:
    format:
      date-time: "yyyy-MM-dd HH:mm:ss"

server:
  port: 8080

logging:
  level:
    ru:
      practicum: DEBUG
    org:
      springframework:
        orm:
          jpa:
            root: INFO
        transaction:
          root: DEBUG
      hibernate:
        SQL: DEBUG

stats-server:
  url: "http://localhost:9090"