spring:
  datasource:
    url: jdbc:postgresql://ewm-db:5432/ewm
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format-sql: true
    show-sql: true
  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    ru:
      practicum: INFO
    org:
      springframework:
        orm:
          jpa:
            root: INFO
        transaction:
          root: DEBUG
      hibernate:
        SQL: DEBUG

stats-server:
  url: "http://localhost:9090"