spring:
  datasource:
    url: jdbc:postgresql://stats-db:5432/stats

  jpa:
    hibernate:
      ddl-auto:none
    properties:
      hibernate:
        format-sql: true
    show-sql: true
  sql:
    init:
      mode: always
server:
  port: 9090

logging:
  level:
    ru:
      practicum: INFO

    org:
      springframework:
        orm:
          jpa:
            root: INFO
        transaction:
          root: DEBUG
      hibernate:
        SQL: DEBUG